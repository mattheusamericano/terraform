  # =============================================================================
  dataproc_master_machine_type: n4-standard-2
  dataproc_master_disk_type: hyperdisk-balanced
  dataproc_master_disk_size: 100
  dataproc_master_num_instances: 1
  dataproc_worker_machine_type: n4-standard-2
  dataproc_worker_disk_type: hyperdisk-balanced
  dataproc_worker_disk_size: 200
  dataproc_worker_num_instances: 2
  dataproc_image_version: 2.3-debian12

  # =============================================================================
  # APACHE SPARK SESSION TEMPLATE (DATAPROC) 
  # =============================================================================
  dataproc_ss_session_type: jupyter
  dataproc_ss_runtime_version: 2.3
  dataproc_ss_serviceaccount: sa-wb-01-tf-des@terraform.iam.gserviceaccount.com
  
  # =============================================================================
  # CLOUD BUILD WORKERPOOL 
  # =============================================================================
  cb_machine_type: e2-standard-4
  cb_disk_size_gb: 100

  # =============================================================================
