parameters:
  - name: project_id
    type: string

  - name: sigla
    type: string

  - name: state_bucket
    type: string

  - name: environment
    type: string

  - name: region
    type: string
    default: "southamerica-east1"

steps:
  - script: |
      BUCKET="gs://${{ parameters.state_bucket }}"

      if [ "${{ parameters.environment }}" = "prd" ]; then
        KMS_KEY="projects/prj-hsm-services-prd/locations/${{ parameters.region }}/keyRings/infrahsmPRDring/cryptoKeys/infraPRDSYMAES256hsm001"
      else
        KMS_KEY="projects/prj-hsm-services-des/locations/${{ parameters.region }}/keyRings/infrahsmNPRDring/cryptoKeys/infraNPRDSYMAES256hsm001"
      fi

      gcloud storage service-agent \
        --project="${{ parameters.project_id }}" \
        --authorize-cmek="${KMS_KEY}"

      echo "Aguardando 30s para a permissão IAM na chave KMS replicar..."
      sleep 30

      if gcloud storage buckets describe "${BUCKET}" > /dev/null 2>&1; then
        echo "##[warning]Bucket ${BUCKET} já existe — pulando criação."
        gcloud storage buckets update "${BUCKET}" --default-encryption-key="${KMS_KEY}"
      else
        gcloud storage buckets create "${BUCKET}" \
          --project="${{ parameters.project_id }}" \
          --location="${{ parameters.region }}" \
          --uniform-bucket-level-access \
          --default-encryption-key="${KMS_KEY}"
        gcloud storage buckets update "${BUCKET}" --versioning
      fi

      for PASTA in "terraform/${{ parameters.sigla }}" "terraform/iam"; do
        if gcloud storage ls "${BUCKET}/${PASTA}/" > /dev/null 2>&1; then
          echo "##[warning]Pasta ${PASTA} já existe — pulando."
        else
          echo "" | gcloud storage cp - "${BUCKET}/${PASTA}/.keep"
        fi
      done
    displayName: "Validate/Create Buckets"