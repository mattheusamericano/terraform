# ==============================================================================
# TEMPLATE — Cloud Workflow: promoção de modelo em produção
# ==============================================================================
# Este workflow, hoje, coordena só a parte de dados:
# 1. Compilação e execução do pipeline de engenharia de dados (Dataform em Prod)
# 2. Publicação do listing correspondente no Analytics Hub
#
# `pipeline_root`, `template_uri` e `service_account` (abaixo, em
# init_variables) são recebidos do .cloudbuild/prod.yaml mas NÃO são usados em
# nenhum step deste workflow — ficam aqui só como exemplo/reserva para o dia
# em que este workflow também disparar o pipeline de treino/deploy do Vertex
# AI (usando o `pipeline.json` gerado a partir de `pipeline_root`/`template_uri`).
# Hoje o treino via Vertex AI só acontece pelo `pipelines/pipeline.py`
# chamado em `.cloudbuild/dev.yaml` (ambiente development) — não há, ainda,
# nenhum step aqui nem em `prod.yaml` que rode o pipeline em produção. Ver
# README.md ("O que este template NÃO conecta ainda").
#
# Este mesmo arquivo é implantado em DOIS projetos diferentes (spoke de
# modelagem via dev.yaml, spoke de produção via prod.yaml) — por isso os
# campos que determinam EM QUAL PROJETO o workflow escreve (project_id,
# repository_id, dataform_service_account, e project_id_hub/data_exchange_id/
# listing_id quando publish_to_hub=true) são OBRIGATÓRIOS no input, sem
# fallback. dev.yaml e prod.yaml sempre passam esses valores explicitamente
# via `--data=`; se o workflow rodar sem eles (ex.: "Execute again" no
# Console sem preencher input), ele falha alto e claro em vez de usar um
# valor padrão — um fallback aqui seria perigoso, porque a instância
# implantada no projeto de modelagem poderia silenciosamente acabar
# escrevendo no projeto de produção (ou vice-versa).
# `location`/`ah_location`/`git_commitish` não determinam o projeto, então
# mantêm um default seguro para facilitar teste manual.
#
# `publish_to_hub` (bool): controla se a ETAPA 2 (Analytics Hub) roda depois
# do Dataform. dev.yaml manda `false` (modelagem só compila/roda o Dataform,
# não publica nada) e prod.yaml manda `true`. Default seguro = false — se
# omitido, o workflow só faz o Dataform e não tenta publicar.
#
# check_missing_inputs/validate_required_inputs (logo abaixo): se faltar
# algum campo obrigatório, a mensagem de erro já lista pelo nome exatamente
# quais campos vieram null — não precisa adivinhar. Para achar a causa raiz
# (qual placeholder não foi preenchido), veja o log do step
# trigger-cloud-workflow-async em dev.yaml/prod.yaml no Cloud Build: ele
# imprime "Inputs: {...}" com o JSON completo enviado, antes de disparar.
# ==============================================================================

main:
  params: [input]
  steps:
    - init_variables:
        assign:
          - project_id: ${map.get(input, "project_id")}
          - project_id_hub: ${map.get(input, "project_id_hub")}
          - dataset_id: ${map.get(input, "dataset_id")}
          - location: ${default(map.get(input, "location"), "__region__")}
          - repository_id: ${map.get(input, "repository_id")}
          - publish_to_hub: ${default(map.get(input, "publish_to_hub"), false)}
          # Reservadas para uso futuro (disparo do pipeline Vertex AI a partir
          # daqui) — nenhum step abaixo consome estas três hoje, ver nota no
          # topo do arquivo.
          - pipeline_root: ${map.get(input, "pipeline_root")}
          - template_uri: ${map.get(input, "template_uri")}
          - service_account: ${map.get(input, "service_account")}
          - dataform_service_account: ${map.get(input, "dataform_service_account")}
          - git_commitish: ${default(map.get(input, "git_commitish"), "__dataform_git_commitish__")}
          # --- Variáveis do Analytics Hub (só obrigatórias se publish_to_hub=true) ---
          - ah_location: ${default(map.get(input, "ah_location"), "__region__")}
          - data_exchange_id: ${map.get(input, "data_exchange_id")}
          - listing_id: ${map.get(input, "listing_id")}

    - check_missing_inputs:
        assign:
          - missing: []
          - missing: ${if(project_id == null, list.concat(missing, "project_id"), missing)}
          - missing: ${if(dataset_id == null, list.concat(missing, "dataset_id"), missing)}
          - missing: ${if(repository_id == null, list.concat(missing, "repository_id"), missing)}
          - missing: ${if(dataform_service_account == null, list.concat(missing, "dataform_service_account"), missing)}
          - missing: ${if(publish_to_hub and project_id_hub == null, list.concat(missing, "project_id_hub"), missing)}
          - missing: ${if(publish_to_hub and data_exchange_id == null, list.concat(missing, "data_exchange_id"), missing)}
          - missing: ${if(publish_to_hub and listing_id == null, list.concat(missing, "listing_id"), missing)}

    - validate_required_inputs:
        switch:
          - condition: ${len(missing) > 0}
            raise: '${"Input(s) obrigatório(s) ausente(s): " + text.join(missing, ", ") + ". Confira se o placeholder/substitution correspondente está preenchido no vars.env (ou nos substitutions: de dev.yaml/prod.yaml) — veja também o log do step trigger-cloud-workflow-async no Cloud Build, que imprime o JSON completo enviado (Inputs: ...) antes de disparar o workflow."}'

    # ==========================================================================
    # 💾 ETAPA 1: ORQUESTRAÇÃO DE DADOS (DATAFORM)
    # ==========================================================================
    - compile_dataform:
        try:
          call: http.post
          args:
            url: ${"https://dataform.googleapis.com/v1beta1/projects/" + project_id + "/locations/" + location + "/repositories/" + repository_id + "/compilationResults"}
            auth:
              type: OAuth2
            body:
              gitCommitish: ${git_commitish}
          result: compile_res
        retry: ${http.default_retry}

    - set_compilation_name:
        assign:
          - compilation_name: ${compile_res.body.name}

    - start_dataform_invocation:
        try:
          call: http.post
          args:
            url: ${"https://dataform.googleapis.com/v1beta1/projects/" + project_id + "/locations/" + location + "/repositories/" + repository_id + "/workflowInvocations"}
            auth:
              type: OAuth2
            body:
              compilationResult: ${compilation_name}
              invocationConfig:
                serviceAccount: ${dataform_service_account}
          result: invocation_res
        retry: ${http.default_retry}

    - get_invocation_name:
        assign:
          - invocation_name: ${invocation_res.body.name}

    - poll_dataform_status:
        try:
          call: http.get
          args:
            url: ${"https://dataform.googleapis.com/v1beta1/" + invocation_name}
            auth:
              type: OAuth2
          result: status_res
        retry: ${http.default_retry}

    - check_dataform_state:
        switch:
          - condition: ${status_res.body.state == "SUCCEEDED" and publish_to_hub}
            next: publish_to_analytics_hub
          - condition: ${status_res.body.state == "SUCCEEDED" and not publish_to_hub}
            next: success_dataform_only
          - condition: ${status_res.body.state == "FAILED" or status_res.body.state == "CANCELLED"}
            next: dataform_failed
        next: wait_and_poll_dataform

    - wait_and_poll_dataform:
        call: sys.sleep
        args:
          seconds: 15
        next: poll_dataform_status

    - dataform_failed:
        raise: ${"Dataform invocation failed with state " + status_res.body.state}

    # ==========================================================================
    # 📊 ETAPA 2: PUBLICAR NO ANALYTICS HUB (FINAL DA PIPELINE)
    # ==========================================================================
    - publish_to_analytics_hub:
        try:
          call: http.post
          args:
            # Atenção: Usando ah_location para garantir a região correta da Exchange
            url: ${"https://analyticshub.googleapis.com/v1/projects/" + project_id_hub + "/locations/" + ah_location + "/dataExchanges/" + data_exchange_id + "/listings?listingId=" + listing_id}
            auth:
              type: OAuth2
            body:
              displayName: ${"Listing para o dataset " + dataset_id}
              description: "Listing gerado e atualizado via Cloud Workflows"
              bigqueryDataset:
                dataset: ${"projects/" + project_id + "/datasets/" + dataset_id}
          result: ah_listing_res
        except:
          as: e
          steps:
            - check_if_listing_exists:
                switch:
                  - condition: ${e.code == 409}
                    next: listing_already_exists
                next: raise_ah_error
            - raise_ah_error:
                raise: ${"Erro ao publicar no Analytics Hub - " + json.encode_to_string(e)}
        next: success_new_listing

    # ==========================================================================
    # ✅ RETORNOS FINAIS DA PIPELINE
    # ==========================================================================
    - success_dataform_only:
        return: "Sucesso: Dataform executado. Publicação no Analytics Hub foi pulada (publish_to_hub=false)."

    - listing_already_exists:
        return: "Aviso: A execução do Dataform foi concluída, mas a etapa do Analytics Hub identificou que o listing já existe (Erro 409). Pipeline finalizada."

    - success_new_listing:
        return: "Sucesso: Dataform executado e novo listing criado no Analytics Hub!"
