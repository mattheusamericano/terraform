
# ==============================================================================
# 🚀 BLUEPRINT: DATAFORM + ANALYTICS HUB + SCHEDULE MANAGEMENT
# ==============================================================================

main:
  params: [input]
  steps:
    - init_variables:
        assign:
          # --- Variável de Controle de Ação ---
          # Opções suportadas: "RUN", "DELETE_LISTING", "DELETE_SCHEDULE", "PAUSE_SCHEDULE", "RESUME_SCHEDULE"
          - action: ${default(map.get(input, "action"), "RUN")}
          
          # --- Parâmetros de Projeto e Regiões ---
          - project_id: ${map.get(input, "project_id")}
          - project_id_hub: ${map.get(input, "project_id_hub")}
          - location: ${default(map.get(input, "location"), "__region__")}
          - ah_location: ${default(map.get(input, "ah_location"), "__region__")}

          # --- Parâmetros do Dataform ---
          - repository_id: ${map.get(input, "repository_id")}
          - dataform_service_account: ${map.get(input, "dataform_service_account")}
          - git_commitish: ${map.get(input, "git_commitish")}       

           # --- Parâmetros de Agendamento (Schedule) ---
          # schedule_enabled controla, dentro do fluxo RUN, se o agendamento
          # nativo do Dataform (release-diaria/agendamento-diario) é
          # criado/atualizado (true) ou apagado (false) ao final desta
          # execução — ver route_schedule mais abaixo. Vem de
          # SCHEDULE_NPROD_ENABLED (dev.yaml) / SCHEDULE_PROD_ENABLED (prod.yaml).
          - schedule_enabled: ${default(map.get(input, "schedule_enabled"), true)}
          - cron_release_config: ${default(map.get(input, "cron_release_config"), "*/5 * * * *")}
          - cron_workflow_config: ${default(map.get(input, "cron_workflow_config"), "*/5 * * * *")}
          - time_zone: "America/Sao_Paulo"
          - included_tags: "prod"

          # --- Variáveis do Analytics Hub (só obrigatórias se publish_to_hub=true) ---
          - publish_to_hub: ${default(map.get(input, "publish_to_hub"), false)}
          - dataset_id: ${map.get(input, "dataset_id")}
          - data_exchange_id: ${map.get(input, "data_exchange_id")}
          - listing_id: ${map.get(input, "listing_id")}
          - listing_display_name: ${default(map.get(input, "listing_display_name"), "Listing para o dataset " + dataset_id)}
          - listing_description: ${default(map.get(input, "listing_description"), "Listing gerado e atualizado via Cloud Workflows")}
          
          # Reservadas para uso futuro (disparo do pipeline Vertex AI a partir
          # daqui) — nenhum step abaixo consome estas três hoje, ver nota no
          # topo do arquivo.
          - pipeline_root: ${map.get(input, "pipeline_root")}
          - template_uri: ${map.get(input, "template_uri")}
          - service_account: ${map.get(input, "service_account")}

    - check_missing_inputs:
        assign:
          - missing: []
          - missing: ${if(project_id == null, list.concat(missing, "project_id"), missing)}
          - missing: ${if(dataset_id == null, list.concat(missing, "dataset_id"), missing)}
          - missing: ${if(repository_id == null, list.concat(missing, "repository_id"), missing)}
          - missing: ${if(dataform_service_account == null, list.concat(missing, "dataform_service_account"), missing)}
          - missing: ${if(git_commitish == null, list.concat(missing, "git_commitish"), missing)}
          - missing: ${if(publish_to_hub and project_id_hub == null, list.concat(missing, "project_id_hub"), missing)}
          - missing: ${if(publish_to_hub and data_exchange_id == null, list.concat(missing, "data_exchange_id"), missing)}
          - missing: ${if(publish_to_hub and listing_id == null, list.concat(missing, "listing_id"), missing)}
          - missing_str: ""

    - build_missing_message:
        for:
          value: missing_field
          in: ${missing}
          steps:
            - append_missing_field:
                assign:
                  - missing_str: ${missing_str + missing_field + " "}

    - validate_required_inputs:
        switch:
          - condition: ${len(missing) > 0}
            raise: '${"Input(s) obrigatório(s) ausente(s): " + missing_str + "- confira se o placeholder/substitution correspondente está preenchido no vars.env (ou nos substitutions: de dev.yaml/prod.yaml). Veja também o log do step trigger-cloud-workflow-async no Cloud Build, que imprime o JSON completo enviado (Inputs: ...) antes de disparar o workflow."}'

    # ==========================================================================
    # 🔀 ROTEADOR DE AÇÕES (CONTROL PLANE)
    # ==========================================================================
    - route_action:
        switch:
          - condition: ${action == "DELETE_LISTING"}
            next: delete_listing
          - condition: ${action == "DELETE_SCHEDULE"}
            next: delete_workflow_schedule
          - condition: ${action == "PAUSE_SCHEDULE"}
            next: pause_schedule
          - condition: ${action == "RESUME_SCHEDULE"}
            next: resume_schedule
          - condition: ${action == "RUN"}
            next: set_dataform_env
  # Se digitar errado ou mandar uma ação que não existe, aborta a esteira!
        next: invalid_action_error

    - invalid_action_error:
        raise: ${"ERRO - Ação inválida ou não suportada -> [" + action + "]. Verifique o payload enviado."}        


    # ==========================================================================
    # 💾 ETAPA 1: ORQUESTRAÇÃO DE DADOS (DATAFORM)
    # ==========================================================================
    - set_dataform_env: 
        switch:
          - condition: '${git_commitish == "modelagem"}'
            assign:
              - dataform_env: "modelagem"

          - condition: '${git_commitish == "main"}'
            assign:
              - dataform_env: "inferencia"

    - compile_dataform:
        try:
          call: http.post
          args:
            url: ${"https://dataform.googleapis.com/v1beta1/projects/" + project_id + "/locations/" + location + "/repositories/" + repository_id + "/compilationResults"}
            auth:
              type: OAuth2
            body:
              gitCommitish: ${git_commitish}
              codeCompilationConfig:
                vars:
                  env: ${dataform_env}
          result: compile_res
        retry: ${http.default_retry}

    - set_compilation_name:
        assign:
          - compilation_name: ${compile_res.body.name}

    - start_dataform_invocation:
        try:
          call: http.post
          args:
            url: ${"https://dataform.googleapis.com/v1beta1/projects/" + project_id + "/locations/" + location + "/repositories/" + repository_id + "/workflowInvocations"}
            auth:
              type: OAuth2
            body:
              compilationResult: ${compilation_name}
              invocationConfig:
                serviceAccount: ${dataform_service_account}
                # includedTags: 
                #   - ${included_tags}
          result: invocation_res
        retry: ${http.default_retry}

    - get_invocation_name:
        assign:
          - invocation_name: ${invocation_res.body.name}

    - poll_dataform_status:
        try:
          call: http.get
          args:
            url: ${"https://dataform.googleapis.com/v1beta1/" + invocation_name}
            auth:
              type: OAuth2
          result: status_res
        retry: ${http.default_retry}

    - check_dataform_state:
        switch:
          - condition: ${status_res.body.state == "SUCCEEDED" and git_commitish == "main" and publish_to_hub}
            next: publish_to_analytics_hub
          - condition: ${status_res.body.state == "SUCCEEDED" and git_commitish == "main" and not publish_to_hub}
            next: delete_listing_on_run
          - condition: ${status_res.body.state == "SUCCEEDED" and git_commitish != "main"}
            next: route_schedule
          - condition: ${status_res.body.state == "FAILED" or status_res.body.state == "CANCELLED"}
            next: dataform_failed
        next: wait_and_poll_dataform

    - wait_and_poll_dataform:
        call: sys.sleep
        args:
          seconds: 15
        next: poll_dataform_status

    - dataform_failed:
        raise: ${"Dataform invocation failed with state " + status_res.body.state}



    # ==========================================================================
    # 📊 ETAPA 2: PUBLICAR NO ANALYTICS HUB
    # ==========================================================================
    - publish_to_analytics_hub:
        try:
          call: http.post
          args:
            # Atenção: Usando ah_location para garantir a região correta da Exchange
            url: ${"https://analyticshub.googleapis.com/v1/projects/" + project_id_hub + "/locations/" + ah_location + "/dataExchanges/" + data_exchange_id + "/listings?listingId=" + listing_id}
            auth:
              type: OAuth2
            body:
              displayName: ${listing_display_name}
              description: ${listing_description}
              bigqueryDataset:
                dataset: ${"projects/" + project_id + "/datasets/" + dataset_id}
          result: ah_listing_res
        except:
          as: e
          steps:
            - check_if_listing_exists:
                switch:
                  - condition: ${e.code == 409}
                    next: update_existing_listing
                next: raise_ah_error
            - raise_ah_error:
                raise: ${"Erro ao publicar no Analytics Hub - " + json.encode_to_string(e)}
        next: route_schedule

    - update_existing_listing:
        try:
          call: http.patch
          args:
            url: ${"https://analyticshub.googleapis.com/v1/projects/" + project_id_hub + "/locations/" + ah_location + "/dataExchanges/" + data_exchange_id + "/listings/" + listing_id + "?updateMask=displayName,description"}
            auth:
              type: OAuth2
            body:
              displayName: ${listing_display_name}
              description: ${listing_description}
          result: ah_update_res
        retry: ${http.default_retry}
        next: route_schedule

    # --- Listing desabilitado (listing_enabled/publish_to_hub=false) na branch
    # main: apaga o listing existente em vez de só pular a publicação, pra
    # essa flag realmente refletir o estado do Analytics Hub. Tolerante a
    # 404 (listing já não existe). ---
    - delete_listing_on_run:
        try:
          call: http.delete
          args:
            url: ${"https://analyticshub.googleapis.com/v1/projects/" + project_id_hub + "/locations/" + ah_location + "/dataExchanges/" + data_exchange_id + "/listings/" + listing_id}
            auth:
              type: OAuth2
        except:
          as: e
          steps:
            - ignore_404_listing_on_run:
                switch:
                  - condition: ${e.code == 404}
                    next: route_schedule
                next: raise_listing_error_on_run
            - raise_listing_error_on_run:
                raise: ${"Erro ao deletar listing - " + json.encode_to_string(e)}
        next: route_schedule

    # ==========================================================================
    # ⏱️ ETAPA 3: CONFIGURAR AGENDAMENTO (DATAFORM SCHEDULE)
    # ==========================================================================
    # route_schedule decide, dentro do RUN, se o agendamento nativo do
    # Dataform é criado/atualizado (schedule_enabled=true) ou apagado
    # (schedule_enabled=false) — ver init_variables.
    - route_schedule:
        switch:
          - condition: ${schedule_enabled}
            next: setup_release_config
        next: delete_workflow_schedule_on_run

    - setup_release_config:
        try:
          call: http.post
          args:
            url: ${"https://dataform.googleapis.com/v1beta1/projects/" + project_id + "/locations/" + location + "/repositories/" + repository_id + "/releaseConfigs?releaseConfigId=release-diaria"}
            auth:
              type: OAuth2
            body:
              gitCommitish: ${git_commitish}
              cronSchedule: ${cron_release_config}
              timeZone: ${time_zone}
        except:
          as: e
          steps:
            - check_release_conflict:
                switch:
                  - condition: ${e.code == 409}
                    next: patch_release_config
                next: raise_release_setup_error
            - raise_release_setup_error:
                raise: ${"Erro na configuração da Release do Dataform - " + json.encode_to_string(e)}
        next: setup_workflow_config

    - patch_release_config:
        call: http.patch
        args:
          url: ${"https://dataform.googleapis.com/v1beta1/projects/" + project_id + "/locations/" + location + "/repositories/" + repository_id + "/releaseConfigs/release-diaria?updateMask=gitCommitish,cronSchedule,timeZone"}
          auth:
            type: OAuth2
          body:
            gitCommitish: ${git_commitish}
            cronSchedule: ${cron_release_config}
            timeZone: ${time_zone}
        next: setup_workflow_config

    - setup_workflow_config:
        try:
          call: http.post
          args:
            url: ${"https://dataform.googleapis.com/v1beta1/projects/" + project_id + "/locations/" + location + "/repositories/" + repository_id + "/workflowConfigs?workflowConfigId=agendamento-diario"}
            auth:
              type: OAuth2
            body:
              releaseConfig: ${"projects/" + project_id + "/locations/" + location + "/repositories/" + repository_id + "/releaseConfigs/release-diaria"}
              cronSchedule: ${cron_workflow_config}
              timeZone: ${time_zone}
              invocationConfig:
                serviceAccount: ${dataform_service_account}
                # includedTags: 
                #   - ${included_tags}
        except:
          as: e
          steps:
            - check_workflow_conflict:
                switch:
                  - condition: ${e.code == 409}
                    next: patch_workflow_config
                next: raise_schedule_setup_error
            - raise_schedule_setup_error:
                raise: ${"Erro na configuração de agendamento do Dataform - " + json.encode_to_string(e)}
        next: success_run

    - patch_workflow_config:
        call: http.patch
        args:
          url: ${"https://dataform.googleapis.com/v1beta1/projects/" + project_id + "/locations/" + location + "/repositories/" + repository_id + "/workflowConfigs/agendamento-diario?updateMask=releaseConfig,cronSchedule,timeZone,invocationConfig.serviceAccount,invocationConfig.includedTags"}
          auth:
            type: OAuth2
          body:
            releaseConfig: ${"projects/" + project_id + "/locations/" + location + "/repositories/" + repository_id + "/releaseConfigs/release-diaria"}
            cronSchedule: ${cron_workflow_config}
            timeZone: ${time_zone}
            invocationConfig:
              serviceAccount: ${dataform_service_account}
              # includedTags: 
              #   - ${included_tags}
        next: success_run

    # --- Schedule desabilitado (schedule_enabled=false): apaga o agendamento
    # nativo do Dataform em vez de criar/atualizar — cópia de
    # delete_workflow_schedule/delete_release_schedule (rota abaixo, usada
    # pela action standalone DELETE_SCHEDULE), mas terminando em success_run
    # em vez de success_action por rodar dentro do fluxo RUN. Tolerante a 404
    # (agendamento já não existe). ---
    - delete_workflow_schedule_on_run:
        try:
          call: http.delete
          args:
            url: ${"https://dataform.googleapis.com/v1beta1/projects/" + project_id + "/locations/" + location + "/repositories/" + repository_id + "/workflowConfigs/agendamento-diario"}
            auth:
              type: OAuth2
        except:
          as: e
          steps:
            - ignore_404_workflow_on_run:
                switch:
                  - condition: ${e.code == 404}
                    next: delete_release_schedule_on_run
                next: raise_workflow_error_on_run
            - raise_workflow_error_on_run:
                raise: ${"Erro ao deletar Workflow Config - " + json.encode_to_string(e)}
        next: delete_release_schedule_on_run

    - delete_release_schedule_on_run:
        try:
          call: http.delete
          args:
            url: ${"https://dataform.googleapis.com/v1beta1/projects/" + project_id + "/locations/" + location + "/repositories/" + repository_id + "/releaseConfigs/release-diaria"}
            auth:
              type: OAuth2
        except:
          as: e
          steps:
            - ignore_404_release_on_run:
                switch:
                  - condition: ${e.code == 404}
                    next: success_run
                next: raise_release_error_on_run
            - raise_release_error_on_run:
                raise: ${"Erro ao deletar Release Config - " + json.encode_to_string(e)}
        next: success_run

    - success_run:
        return: ${(if(publish_to_hub, "Analytics Hub publicado", "Analytics Hub ignorado/listing removido")) + " | " + (if(schedule_enabled, "agendamento validado", "agendamento removido"))}

    # ==========================================================================
    # 🛠️ ROTAS DE GESTÃO E INFRAESTRUTURA (ACTIONS EXTRAS)
    # ==========================================================================
    
    # --- Deleta vitrine no Analytics Hub ---
    - delete_listing:
        try:
          call: http.delete
          args:
            url: ${"https://analyticshub.googleapis.com/v1/projects/" + project_id_hub + "/locations/" + ah_location + "/dataExchanges/" + data_exchange_id + "/listings/" + listing_id}
            auth:
              type: OAuth2
        except:
          as: e
          steps:
            - ignore_404_listing:
                switch:
                  - condition: ${e.code == 404}
                    next: success_action
                next: raise_listing_error
            - raise_listing_error:
                raise: ${"Erro ao deletar listing - " + json.encode_to_string(e)}
        next: success_action

    # --- Deleta agendamento no Dataform (Workflow Config -> Release Config) ---
    - delete_workflow_schedule:
        try:
          call: http.delete
          args:
            url: ${"https://dataform.googleapis.com/v1beta1/projects/" + project_id + "/locations/" + location + "/repositories/" + repository_id + "/workflowConfigs/agendamento-diario"}
            auth:
              type: OAuth2
        except:
          as: e
          steps:
            - ignore_404_workflow:
                switch:
                  - condition: ${e.code == 404}
                    next: delete_release_schedule
                next: raise_workflow_error
            - raise_workflow_error:
                raise: ${"Erro ao deletar Workflow Config - " + json.encode_to_string(e)}
        next: delete_release_schedule

    - delete_release_schedule:
        try:
          call: http.delete
          args:
            url: ${"https://dataform.googleapis.com/v1beta1/projects/" + project_id + "/locations/" + location + "/repositories/" + repository_id + "/releaseConfigs/release-diaria"}
            auth:
              type: OAuth2
        except:
          as: e
          steps:
            - ignore_404_release:
                switch:
                  - condition: ${e.code == 404}
                    next: success_action
                next: raise_release_error
            - raise_release_error:
                raise: ${"Erro ao deletar Release Config - " + json.encode_to_string(e)}
        next: success_action

    # --- Pausa e Retoma Agendamentos ---
    - pause_schedule:
        call: http.patch
        args:
          url: ${"https://dataform.googleapis.com/v1beta1/projects/" + project_id + "/locations/" + location + "/repositories/" + repository_id + "/workflowConfigs/agendamento-diario?updateMask=cronSchedule"}
          auth:
            type: OAuth2
          body:
            cronSchedule: "" # String vazia para suspender a execução
        next: success_action

    - resume_schedule:
        call: http.patch
        args:
          url: ${"https://dataform.googleapis.com/v1beta1/projects/" + project_id + "/locations/" + location + "/repositories/" + repository_id + "/workflowConfigs/agendamento-diario?updateMask=cronSchedule"}
          auth:
            type: OAuth2
          body:
            cronSchedule: ${cron_workflow_config} # Retoma com o cron parametrizado
        next: success_action

    # --- Retorno dinâmico com a Ação Executada ---
    - success_action:
        return: ${"✅ SUCESSO - Ação de gestão de infraestrutura [" + action + "] concluída com sucesso."}
 