# ==============================================================================
# Cloud Build: Ambiente de Desenvolvimento / Modelagem (MDL)
# ==============================================================================
# Mesmo fluxo do .cloudbuild/prod.yaml (implanta e dispara o Cloud Workflow de
# promoção — compila Dataform e publica o listing no Analytics Hub), só que
# apontando pro ambiente de modelagem/dev (model_training.environments.
# development em model-config.yaml) em vez de produção.
#
# O projeto de destino vem de $PROJECT_ID (variável nativa do Cloud Build,
# definida pela flag --project de quem dispara o build — ver deploy.yml).
# Os parâmetros do ambiente (project_id, dataset, pipeline_root,
# service_account) vêm de model-config.yaml, não deste arquivo.
#
# Os demais valores são declarados em `substitutions:` abaixo — preenchidos em
# tempo de execução a partir de vars.env (ver deploy.yml/apply-vars.sh).
# Também podem ser sobrescritos por build, sem editar este arquivo:
#   gcloud builds submit --config=.cloudbuild/dev.yaml \
#     --substitutions=_REGION=us-central1 .
# ==============================================================================

substitutions:
  _TAG_NAME: 'dev'
  _REGION: '__region__'
  _WORKFLOW_NAME: '__workflow_name__'
  _WORKFLOW_SOURCE_FILE: 'pipelines/model_promotion_workflow.yaml'
  _DATAFORM_REPOSITORY_ID: '__dataform_repository_id__'
  _DATAFORM_SA_PREFIX_TRAIN: '__dataform_sa_prefix_train__'
  _ARTIFACT_REGISTRY_INDEX_URL: '__artifact_registry_index_url__'
  _HUB_PROJECT_ID: '__hub_project_id__'
  _DATA_EXCHANGE_ID: '__data_exchange_id__'
  _LISTING_ID: '__listing_id__'

steps:
  # -------------------------------------------------------------
  # 🏛️ Passo 1: Implantar o Cloud Workflow no Spoke de Modelagem
  # -------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:latest'
    id: 'deploy-cloud-workflow'
    entrypoint: 'sh'
    args:
      - '-c'
      - |

        pip3 install --index-url ${_ARTIFACT_REGISTRY_INDEX_URL} pyyaml --quiet --break-system-packages 2>/dev/null
        python3 -c "
        import yaml
        import subprocess

        # Carrega configurações de modelagem/dev
        with open('model-config.yaml', 'r') as f:
            config = yaml.safe_load(f)

        dev_config = config['model_training']['environments']['development']
        project_id = dev_config['project_id']
        service_account = dev_config['service_account']

        workflow_name = '${_WORKFLOW_NAME}'
        source_file = '${_WORKFLOW_SOURCE_FILE}'
        location = '${_REGION}'

        print(f'=== Implantando Cloud Workflow {workflow_name} no projeto {project_id} ===')
        # Executa o deploy do workflow usando a Service Account do spoke de modelagem
        cmd = [
            'gcloud', 'workflows', 'deploy', workflow_name,
            f'--source={source_file}',
            f'--location={location}',
            f'--project={project_id}',
            f'--service-account={service_account}'
        ]
        subprocess.run(cmd, check=True)
        "

  # -------------------------------------------------------------
  # ⚡ Passo 2: Executar o Workflow de forma Assíncrona e Encerrar
  # -------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:latest'
    id: 'trigger-cloud-workflow-async'
    entrypoint: 'sh'
    env:
      - 'TAG_NAME=$_TAG_NAME'
    args:
      - '-c'
      - |
        pip3 install --index-url ${_ARTIFACT_REGISTRY_INDEX_URL} pyyaml --quiet --break-system-packages 2>/dev/null
        python3 -c "
        import yaml
        import json
        import subprocess
        import os

        # Carrega configurações de modelagem/dev
        with open('model-config.yaml', 'r') as f:
            config = yaml.safe_load(f)

        dev_config = config['model_training']['environments']['development']
        project_id = dev_config['project_id']
        dataset_id = dev_config['dataset_id']
        pipeline_root = dev_config['pipeline_root']
        service_account = dev_config['service_account']

        tag_name = os.getenv('TAG_NAME', '${_TAG_NAME}') # Fallback se rodar manualmente
        template_uri = f'{pipeline_root}/pipeline.json'

        # Monta os inputs que o Workflow espera
        workflow_inputs = {
            'project_id': project_id,
            'dataset_id': dataset_id,
            'location': '${_REGION}',
            'repository_id': '${_DATAFORM_REPOSITORY_ID}',
            'pipeline_root': pipeline_root,
            'template_uri': template_uri,
            'service_account': service_account,
            'dataform_service_account': f'${_DATAFORM_SA_PREFIX_TRAIN}@{project_id}.iam.gserviceaccount.com',
            'git_commitish': 'modelagem',  # branch do repo Dataform correspondente ao ambiente de modelagem
            'publish_to_hub': False,  # modelagem só compila/roda o Dataform, não publica no Analytics Hub
            'project_id_hub': '${_HUB_PROJECT_ID}',
            'data_exchange_id': '${_DATA_EXCHANGE_ID}',
            'listing_id': '${_LISTING_ID}'
        }

        workflow_name = '${_WORKFLOW_NAME}'
        location = '${_REGION}'
        inputs_json = json.dumps(workflow_inputs)

        print(f'=== Executando o Cloud Workflow {workflow_name} de forma ASSÍNCRONA ===')
        print(f'Inputs: {inputs_json}')

        cmd = [
            'gcloud', 'workflows', 'run', workflow_name,
            f'--location={location}',
            f'--project={project_id}',
            f'--data={inputs_json}'
        ]

        # Executa de forma assíncrona (não espera o término da execução longa de Dataform)
        subprocess.run(cmd, check=True)
        print('=== Cloud Workflow inicializado com SUCESSO! Finalizando o step do Cloud Build. ===')
        "

options:
  # CLOUD_LOGGING_ONLY (em vez do default LEGACY) é exigido pelo Cloud Build
  # sempre que o build roda com --service-account customizado (ver
  # CLOUDBUILD_SERVICE_ACCOUNT_NPRD em vars.env, passado por deploy.yml).
  logging: 'CLOUD_LOGGING_ONLY'
  env:
    - 'no_proxy=metadata,metadata.google.internal,169.254.169.254,googleapis.com,*.googleapis.com,gcr.io,pkg.dev'
    - 'NO_PROXY=metadata,metadata.google.internal,169.254.169.254,googleapis.com,*.googleapis.com,gcr.io,pkg.dev'
