# ==============================================================================
# TEMPLATE — Cloud Build: Ambiente de Desenvolvimento / Modelagem (MDL)
# ==============================================================================
# O projeto de destino vem de $PROJECT_ID (variável nativa do Cloud Build,
# definida pela flag --project de quem dispara o build — ver deploy.yml).
#
# Os demais valores são declarados em `substitutions:` abaixo. Preencha os
# defaults com os dados do seu produto (ou use generate.sh + vars.example.env
# para preencher tudo de uma vez). Também podem ser sobrescritos por build,
# sem editar este arquivo:
#   gcloud builds submit --config=.cloudbuild/dev.yaml \
#     --substitutions=_REGION=us-central1 .
# ==============================================================================

substitutions:
  _REGION: '__region__'
  _MODELS_DATASET: '__models_dataset__'
  _ARTIFACT_REGISTRY_INDEX_URL: '__artifact_registry_index_url__'
  _PIPELINE_SCRIPT: 'pipelines/pipeline.py'

steps:
  # -------------------------------------------------------------
  # 🛠️ Passo 0: Garantir a existência do dataset de modelos
  # -------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:latest'
    id: 'ensure-models-dataset'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        echo "=== Garantindo a existência do Dataset '${_MODELS_DATASET}' ==="
        bq query --use_legacy_sql=false 'CREATE SCHEMA IF NOT EXISTS `$PROJECT_ID.${_MODELS_DATASET}` OPTIONS(location="${_REGION}");'

  # -------------------------------------------------------------
  # 🚀 Passo 1: Compilar e Submeter o Pipeline de Treino no Vertex AI
  # -------------------------------------------------------------
  - name: 'python:3.10-slim'
    id: 'submit-vertex-pipeline'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        echo "=== Instalando dependências de MLOps ==="
        pip install --index-url ${_ARTIFACT_REGISTRY_INDEX_URL} -r requirements.txt

        echo "=== Compilando e Submetendo o Pipeline para o Vertex AI ==="
        python3 ${_PIPELINE_SCRIPT} --submit

options:
  logging: 'CLOUD_LOGGING_ONLY'
  env:
    - 'no_proxy=metadata,metadata.google.internal,169.254.169.254,googleapis.com,*.googleapis.com,gcr.io,pkg.dev'
    - 'NO_PROXY=metadata,metadata.google.internal,169.254.169.254,googleapis.com,*.googleapis.com,gcr.io,pkg.dev'
