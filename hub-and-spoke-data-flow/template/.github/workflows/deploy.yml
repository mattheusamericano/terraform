# ==============================================================================
# TEMPLATE — GitHub Actions: gatilho de CI/CD via Cloud Build
# ==============================================================================
# Este arquivo NÃO tem placeholder nenhum — nunca precisa ser editado nem
# "instanciado". Toda a configuração (projetos, região, worker pools, branch,
# etc.) vem de `vars.env`, lido do zero em cada execução pelo job
# `load-config` e repassado aos outros jobs via `needs.load-config.outputs`.
#
# `apply-vars.sh` também roda dentro dos jobs de treino, mas só para resolver
# os placeholders de arquivos que o Cloud Build lê como texto puro
# (model-config.yaml, pipeline.py, os *.sql, os defaults de
# .cloudbuild/*.yaml) — isso acontece só no workspace efêmero do runner,
# nunca é commitado/dado push. `gcloud builds submit .` envia o diretório
# como está naquele momento, resolvido ou não.
#
# Não há nenhum commit automático neste workflow — vars.env é um arquivo
# normal, versionado como qualquer outro; editar um valor é só um commit seu,
# sem exigir nenhuma permissão especial de push em .github/workflows/.
#
# Requer os secrets do repositório:
#   - workload_identity_provider_gcp e service_account_gcp (autenticação via
#     Workload Identity Federation)
#
# TEMPLATE_DIR (abaixo): premissa deste template — ele vive dentro da
# subpasta 'dataform-workflow' do repositório, não na raiz. A raiz do
# repositório é do projeto Dataform (workflow_settings.yaml/definitions/ são
# OBRIGADOS a ficar lá, exigência do próprio Dataform), então o template
# inteiro (.cloudbuild/, pipelines/, apply-vars.sh, vars.env,
# model-config.yaml) cede a raiz e fica em 'dataform-workflow/'. Se algum
# produto não precisar dessa subpasta (repositório dedicado, sem Dataform
# disputando a raiz), troque para '' aqui. Este arquivo (deploy.yml) é a
# ÚNICA exceção à regra "nunca precisa editar" — o resto continua vindo de
# vars.env. Importante: .github/workflows/deploy.yml em si TEM que continuar
# na raiz do repositório — o GitHub só reconhece workflows ali, nunca dentro
# de uma subpasta; não dá pra mover este arquivo junto com o resto.
# ==============================================================================
name: MLOps Model Training Deployment

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {} # fallback manual (aba Actions → "Run workflow")

env:
  TEMPLATE_DIR: 'dataform-workflow'

jobs:
  # --------------------------------------------------------------------------
  # Lê vars.env uma vez e repassa os valores pros outros jobs via outputs.
  # Precisa ser um job próprio (em vez de um step dentro de cada job) porque
  # o `if:` de cada job é avaliado ANTES de qualquer step daquele job rodar —
  # só um job anterior, com seu próprio checkout, consegue produzir um valor
  # que os outros jobs usam no `if:`/`env` deles.
  # --------------------------------------------------------------------------
  load-config:
    name: Carrega configuração de vars.env
    runs-on: ubuntu-latest
    outputs:
      project_id_mdl: ${{ steps.vars.outputs.project_id_mdl }}
      project_id_inf: ${{ steps.vars.outputs.project_id_inf }}
      region: ${{ steps.vars.outputs.region }}
      workerpool_mdl: ${{ steps.vars.outputs.workerpool_mdl }}
      workerpool_inf: ${{ steps.vars.outputs.workerpool_inf }}
      branch_name: ${{ steps.vars.outputs.branch_name }}
      prod_branch_name: ${{ steps.vars.outputs.prod_branch_name }}
      cloudbuild_sa_nprd: ${{ steps.vars.outputs.cloudbuild_sa_nprd }}
      cloudbuild_sa_prd: ${{ steps.vars.outputs.cloudbuild_sa_prd }}
    steps:
      - uses: actions/checkout@v4

      - name: Lê vars.env
        id: vars
        run: |
          # Extrai cada chave direto do arquivo (grep/cut), em vez de usar
          # `source` (que executa o arquivo inteiro como código bash — uma
          # única linha mal formada em qualquer lugar do arquivo derruba o
          # job inteiro com um erro difícil de entender). Tolera \r de fim de
          # linha (CRLF/Windows) e espaços em branco no começo/fim do valor
          # (ex.: "CHAVE= valor" com espaço depois do "=" — sem isso, esse
          # espaço vaza pro comando gcloud e vira um argumento vazio).
          VARS_FILE="${TEMPLATE_DIR:+$TEMPLATE_DIR/}vars.env"

          get_var() {
            grep -E "^$1=" "$VARS_FILE" | tail -n1 | cut -d'=' -f2- | tr -d '\r' \
              | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'
          }

          PROJECT_ID_MDL="$(get_var TRAIN_PROJECT_ID)"
          PROJECT_ID_INF="$(get_var SERVING_PROJECT_ID)"
          REGION_VAL="$(get_var REGION)"
          WORKERPOOL_MDL_VAL="$(get_var WORKERPOOL_DEV)"
          WORKERPOOL_INF_VAL="$(get_var WORKERPOOL_PROD)"
          BRANCH_NAME_VAL="$(get_var BRANCH_NAME)"
          PROD_BRANCH_NAME_VAL="$(get_var PROD_BRANCH_NAME)"
          CLOUDBUILD_SA_NPRD_VAL="$(get_var CLOUDBUILD_SERVICE_ACCOUNT_NPRD)"
          CLOUDBUILD_SA_PRD_VAL="$(get_var CLOUDBUILD_SERVICE_ACCOUNT_PRD)"

          # Debug: imprime o que foi extraído no log do job (não é secret,
          # são só nomes de projeto/branch/worker pool) — se algo aqui sair
          # vazio ou diferente do esperado, é por isso que os jobs de treino
          # ficam "skipped" (o `if:` deles depende desses valores).
          echo "=== Valores extraídos de $VARS_FILE ==="
          echo "TRAIN_PROJECT_ID   -> '$PROJECT_ID_MDL'"
          echo "SERVING_PROJECT_ID -> '$PROJECT_ID_INF'"
          echo "REGION             -> '$REGION_VAL'"
          echo "WORKERPOOL_DEV     -> '$WORKERPOOL_MDL_VAL'"
          echo "WORKERPOOL_PROD    -> '$WORKERPOOL_INF_VAL'"
          echo "BRANCH_NAME        -> '$BRANCH_NAME_VAL'"
          echo "PROD_BRANCH_NAME   -> '$PROD_BRANCH_NAME_VAL'"
          echo "CLOUDBUILD_SERVICE_ACCOUNT_NPRD -> '$CLOUDBUILD_SA_NPRD_VAL'"
          echo "CLOUDBUILD_SERVICE_ACCOUNT_PRD  -> '$CLOUDBUILD_SA_PRD_VAL'"
          echo "github.ref deste run -> '${{ github.ref }}'"
          echo "===================================="

          echo "project_id_mdl=$PROJECT_ID_MDL" >> "$GITHUB_OUTPUT"
          echo "project_id_inf=$PROJECT_ID_INF" >> "$GITHUB_OUTPUT"
          echo "region=$REGION_VAL" >> "$GITHUB_OUTPUT"
          echo "workerpool_mdl=$WORKERPOOL_MDL_VAL" >> "$GITHUB_OUTPUT"
          echo "workerpool_inf=$WORKERPOOL_INF_VAL" >> "$GITHUB_OUTPUT"
          echo "branch_name=$BRANCH_NAME_VAL" >> "$GITHUB_OUTPUT"
          echo "prod_branch_name=$PROD_BRANCH_NAME_VAL" >> "$GITHUB_OUTPUT"
          echo "cloudbuild_sa_nprd=$CLOUDBUILD_SA_NPRD_VAL" >> "$GITHUB_OUTPUT"
          echo "cloudbuild_sa_prd=$CLOUDBUILD_SA_PRD_VAL" >> "$GITHUB_OUTPUT"

  train-and-evaluate-mdl:
    name: Train and Evaluate Model (MDL)
    needs: load-config
    if: github.ref == format('refs/heads/{0}', needs.load-config.outputs.branch_name)
    runs-on: arc-runner-set-default-gcp-caixagithub-prod
    permissions:
      contents: read
      id-token: write   # necessário para Workload Identity Federation
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Resolve placeholders no workspace (sem commitar/dar push)
        run: |
          prefix="${TEMPLATE_DIR:+$TEMPLATE_DIR/}"
          chmod +x "${prefix}apply-vars.sh"
          "${prefix}apply-vars.sh" "${prefix}vars.env" "${TEMPLATE_DIR:-.}"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ needs.load-config.outputs.project_id_mdl }}
          token_format: "access_token"
          workload_identity_provider: ${{ secrets.workload_identity_provider_gcp }}
          service_account: ${{ secrets.service_account_gcp }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Submit Cloud Build (implanta + dispara o Cloud Workflow) via Private Pool
        run: |
          prefix="${TEMPLATE_DIR:+$TEMPLATE_DIR/}"
          gcloud builds submit \
            --project=${{ needs.load-config.outputs.project_id_mdl }} \
            --config="${prefix}.cloudbuild/dev.yaml" \
            --worker-pool="projects/${{ needs.load-config.outputs.project_id_mdl }}/locations/${{ needs.load-config.outputs.region }}/workerPools/${{ needs.load-config.outputs.workerpool_mdl }}" \
            --region=${{ needs.load-config.outputs.region }} \
            --service-account="${{ needs.load-config.outputs.cloudbuild_sa_nprd }}" \
            "${TEMPLATE_DIR:-.}"

  train-and-evaluate-inf:
    name: Train and Evaluate Model (INF)
    needs: load-config
    # Dispara em duas situações: tag v* (fluxo original) OU push na branch de
    # produção configurada em PROD_BRANCH_NAME (ex.: main) — o que vier primeiro.
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == format('refs/heads/{0}', needs.load-config.outputs.prod_branch_name)
    runs-on: arc-runner-set-default-gcp-caixagithub-prod
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Resolve placeholders no workspace (sem commitar/dar push)
        run: |
          prefix="${TEMPLATE_DIR:+$TEMPLATE_DIR/}"
          chmod +x "${prefix}apply-vars.sh"
          "${prefix}apply-vars.sh" "${prefix}vars.env" "${TEMPLATE_DIR:-.}"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ needs.load-config.outputs.project_id_inf }}
          token_format: "access_token"
          workload_identity_provider: ${{ secrets.workload_identity_provider_gcp }}
          service_account: ${{ secrets.service_account_gcp }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Submit Cloud Build (implanta + dispara o Cloud Workflow) via Private Pool in INF Project
        run: |
          prefix="${TEMPLATE_DIR:+$TEMPLATE_DIR/}"
          gcloud builds submit \
            --project=${{ needs.load-config.outputs.project_id_inf }} \
            --config="${prefix}.cloudbuild/prod.yaml" \
            --worker-pool="projects/${{ needs.load-config.outputs.project_id_inf }}/locations/${{ needs.load-config.outputs.region }}/workerPools/${{ needs.load-config.outputs.workerpool_inf }}" \
            --region=${{ needs.load-config.outputs.region }} \
            --service-account="${{ needs.load-config.outputs.cloudbuild_sa_prd }}" \
            --substitutions="_TAG_NAME=${{ github.ref_name }}" \
            "${TEMPLATE_DIR:-.}"
