# ==============================================================================
# model-config.yaml
# Configuração declarativa dos ambientes de treino/modelagem e inferência —
# lida por .cloudbuild/dev.yaml (development) e .cloudbuild/prod.yaml
# (production) pra saber em qual projeto/dataset/bucket/service account
# implantar e disparar o Cloud Workflow de promoção.
# ==============================================================================
variables:
  region: &region __region__ # ex.: southamerica-east1

  train_project: &train_project __train_project_id__ # projeto (spoke) de treino/modelagem
  serving_project: &serving_project __serving_project_id__ # projeto (spoke) de serving/inferência

  train_bucket: &train_bucket __train_pipeline_root__ # ex.: gs://bucket-data-subs-des/pipeline_root
  serving_bucket: &serving_bucket __serving_pipeline_root__ # ex.: gs://bucket-data-pub-des/pipeline_root

  train_service_account: &train_sa __train_service_account__
  serving_service_account: &serving_sa __serving_service_account__

model_training:
  environments:
    development:
      project_id: *train_project
      dataset_id: "__dataset_id__" # ex.: served
      pipeline_root: *train_bucket
      service_account: *train_sa

    production:
      project_id: *serving_project
      dataset_id: "__dataset_id__"
      pipeline_root: *serving_bucket
      service_account: *serving_sa
