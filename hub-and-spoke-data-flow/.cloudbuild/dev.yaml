steps:
  # -------------------------------------------------------------
  # 🛠️ Passo 0: Garantir a existência do dataset de modelos
  # -------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:latest'
    id: 'ensure-models-dataset'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        echo "=== Garantindo a existência do Dataset 'models' ==="
        bq query --use_legacy_sql=false 'CREATE SCHEMA IF NOT EXISTS `prj-subscriber-poc.models` OPTIONS(location="southamerica-east1");'

  # -------------------------------------------------------------
  # 🚀 Passo 1: Compilar e Submeter o Pipeline de Treino no Vertex AI
  # -------------------------------------------------------------
  - name: 'python:3.10-slim'
    id: 'submit-vertex-pipeline'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        echo "=== Instalando dependências de MLOps ==="
        pip install --index-url https://southamerica-east1-python.pkg.dev/prj-artifact-services-prd/acr-artifact-prd-001/simple/ \
          kfp==2.16.0 \
          google-cloud-pipeline-components==2.22.0 \
          google-cloud-aiplatform==1.159.0 \
          pyyaml

        echo "=== Compilando e Submetendo o Pipeline para o Vertex AI ==="
        python3 pipelines/pipeline.py --submit

options:
  logging: 'CLOUD_LOGGING_ONLY'
  env:
    - 'no_proxy=metadata,metadata.google.internal,169.254.169.254,googleapis.com,*.googleapis.com,gcr.io,pkg.dev'
    - 'NO_PROXY=metadata,metadata.google.internal,169.254.169.254,googleapis.com,*.googleapis.com,gcr.io,pkg.dev'
